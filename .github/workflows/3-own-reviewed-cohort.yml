name: Apply reviewed owned-cohort release
on:
  push:
    branches: [own-owned-cohort-nov16]
permissions:
  contents: write
jobs:
  apply-and-verify:
    if: contains(github.event.head_commit.message, 'Apply reviewed final bundle')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: own-owned-cohort-nov16
          fetch-depth: 0
      - name: Verify unchanged release baseline
        run: |
          git merge-base --is-ancestor 0335ac54ac2c20a6487dfd6e59d6d4d3f9a45491 HEAD
          test -z "$(git diff --name-only 0335ac54ac2c20a6487dfd6e59d6d4d3f9a45491 HEAD -- src)"
      - name: Apply reviewed application files
        shell: python
        run: |
          import base64,gzip,json,pathlib
          files=json.loads(gzip.decompress(base64.b64decode('')))
          for name,text in files.items():
           p=pathlib.Path(name)
           if not name.startswith('src/') or p.is_absolute() or '..' in p.parts or '/space/' in name or 'pinterest' in name.lower(): raise ValueError('Unexpected path')
           p.parent.mkdir(parents=True,exist_ok=True)
           p.write_text(text)
          [p.unlink() for p in pathlib.Path('.github/workflows').glob('*own-reviewed-cohort.yml')]
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --run --maxWorkers=2
      - run: npm run build
      - name: Commit checked source to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows
          git commit -m "Correct owned-pack finances, target sales, workload and data recovery"
          git push origin HEAD:own-owned-cohort-nov16
