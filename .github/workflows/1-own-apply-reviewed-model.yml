name: Apply reviewed teacher-first model and validate
on:
  push:
    branches: [own-teacher-first-nov16]
permissions:
  contents: write
jobs:
  apply-and-verify:
    if: contains(github.event.head_commit.message, 'Apply reviewed teacher-first bundle')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: own-teacher-first-nov16
      - name: Apply reviewed application files
        shell: python
        run: |
          import base64,gzip,json,pathlib
          files=json.loads(gzip.decompress(base64.b64decode('')))
          for name,text in files.items():
           p=pathlib.Path(name)
           if p.is_absolute() or '..' in p.parts: raise ValueError('Unsafe path')
           p.parent.mkdir(parents=True,exist_ok=True)
           p.write_text(text)
          pathlib.Path('.github/workflows/own-apply-reviewed-model.yml').unlink()
      - name: Commit reviewed source on review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows
          git commit -m "Integrate current teacher-first financial model into Math views"
          git push origin HEAD:own-teacher-first-nov16
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint src/components/finance/own-primary.tsx src/components/finance/own-live.tsx src/lib/finance/own-primary.ts src/lib/finance/own-primary.test.ts
      - run: npm test -- --run --maxWorkers=2
      - run: npm run build
